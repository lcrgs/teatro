<style>
/* Layout: a box-office board — one column of sessions ordered by curtain time, live status chip on each row */
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --ink:#151B2E; --muted:#5B6478; --line:#D5DAE3;
  --accent:#A3123A; --accent-soft:#F6E3E8;
  --ok:#1F7A4D; --ok-soft:#E1F2E8; --warn:#9A5B00; --warn-soft:#FBEFD9; --off:#7A8293; --off-soft:#E7EAF0;
  --display:"Bricolage Grotesque", "Arial Narrow", system-ui, sans-serif;
  --body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10131C; --surface:#181D2A; --ink:#E9ECF3; --muted:#9AA3B6; --line:#2A3142;
  --accent:#F0587E; --accent-soft:#3A1824;
  --ok:#5CCB91; --ok-soft:#173326; --warn:#F2B35A; --warn-soft:#3A2A12; --off:#8790A3; --off-soft:#232938; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10131C; --surface:#181D2A; --ink:#E9ECF3; --muted:#9AA3B6; --line:#2A3142;
  --accent:#F0587E; --accent-soft:#3A1824;
  --ok:#5CCB91; --ok-soft:#173326; --warn:#F2B35A; --warn-soft:#3A2A12; --off:#8790A3; --off-soft:#232938; color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;padding:0 16px}
.wrap{max-width:820px;margin:0 auto;padding-block:24px 56px;display:flex;flex-direction:column;gap:28px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
header{display:flex;flex-direction:column;gap:10px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
h1{font-family:var(--display);font-weight:800;font-size:clamp(2.2rem,7vw,3.6rem);line-height:1;margin:0;text-wrap:balance;letter-spacing:-.02em}
.sub{color:var(--muted);max-width:62ch;margin:0}
.clock{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink)}
.controls{display:flex;flex-wrap:wrap;gap:8px}
.controls button{font:500 13px var(--body);padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.controls button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.lang button{font:600 12px var(--mono);letter-spacing:.06em;padding:6px 12px;border:0;background:transparent;color:var(--muted);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.board{display:flex;flex-direction:column;border-top:2px solid var(--ink)}
.row{display:grid;grid-template-columns:76px 1fr auto;gap:6px 16px;padding:16px 0;border-bottom:1px solid var(--line);align-items:start}
.row.past{opacity:.55}
.time{font-family:var(--mono);font-weight:600;font-size:22px;font-variant-numeric:tabular-nums;line-height:1.1}
.time small{display:block;font-size:11px;font-weight:500;color:var(--muted);margin-top:4px}
.info{min-width:0;display:flex;flex-direction:column;gap:3px}
.title{font-family:var(--display);font-weight:500;font-size:19px;line-height:1.2;margin:0}
.venue{color:var(--muted);font-size:14px}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:var(--muted);margin-top:4px}
.meta .last{color:var(--accent);font-weight:600}
.meta a{color:var(--ink);font-weight:500}
.chip{font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:5px 9px;border-radius:4px;white-space:nowrap;justify-self:end}
.s-later{background:var(--ok-soft);color:var(--ok)}
.s-soon{background:var(--warn-soft);color:var(--warn)}
.s-on{background:var(--accent-soft);color:var(--accent)}
.s-past{background:var(--off-soft);color:var(--off)}
.s-tbc{background:var(--off-soft);color:var(--muted)}
h2{font-family:var(--display);font-weight:500;font-size:20px;margin:0}
section.block{display:flex;flex-direction:column;gap:12px}
.note{font-size:13px;color:var(--muted);border-left:3px solid var(--line);padding-left:12px;max-width:68ch;margin:0}
.empty{padding:16px 0;color:var(--muted);margin:0}
.empty a{color:var(--accent);font-weight:600}
.stale{background:var(--warn-soft);color:var(--warn);padding:10px 14px;border-radius:6px;font-size:14px;margin:0}
footer{font-size:12px;color:var(--muted)}
@media (max-width:520px){
  .row{grid-template-columns:60px 1fr}
  .chip{grid-column:2;justify-self:start}
  .time{font-size:18px}
}
</style>

<div class="wrap">
  <header>
    <div class="topbar">
      <div class="eyebrow" id="eyebrow"></div>
      <div class="lang" role="group" aria-label="Idioma / Language">
        <button type="button" id="lang-pt" aria-pressed="true">PT</button>
        <button type="button" id="lang-en" aria-pressed="false">EN</button>
      </div>
    </div>
    <h1>Hoje em cena</h1>
    <p class="sub"><span id="sub"></span> <span class="clock" id="clock">--:--</span>.</p>
    <p class="stale" id="stale" hidden></p>
    <div class="controls" role="group" id="filters">
      <button type="button" id="f-open" aria-pressed="true"></button>
      <button type="button" id="f-all" aria-pressed="false"></button>
    </div>
  </header>

  <section class="board" id="board" aria-live="polite"></section>

  <section class="block" id="amanha">
    <h2 id="tomorrow-head"></h2>
    <p class="stale" id="tomorrow-warn"></p>
    <p class="note" id="tomorrow-note"></p>
    <div class="board" id="tomorrow"></div>
  </section>

  <section class="block" id="tbc-block">
    <h2 id="tbc-head"></h2>
    <p class="note" id="tbc-note"></p>
    <div class="board" id="tbc"></div>
  </section>

  <p class="note" id="avail-note"></p>

  <footer id="footer"></footer>
</div>

/* ---------- Interface text ---------- */
const UI = {
  pt:{
    sub:"Todas as peças em cena hoje em Lisboa, por ordem de início. O estado atualiza ao vivo pela hora de Lisboa:",
    stale:d=>`Esta lista é de ${d}. A programação de hoje será diferente.`,
    fOpen:"Ainda a tempo", fAll:"Dia inteiro", filters:"Filtrar sessões",
    tmrWarn:"Atenção: esta é a programação de amanhã, recolhida hoje. Horários e lugares podem mudar, e a lista é revista amanhã de manhã.",
    tomorrow:"Amanhã", tbcHead:"Também hoje, hora por confirmar",
    tbcNote:"Constam da bilheteira para hoje, mas não foi possível confirmar a hora. Veja o link antes de ir.",
    avail:"<strong>Lugares disponíveis:</strong> a Ticketline e a BOL só carregam o mapa de lugares no browser, por isso não é possível ler a lotação de fora. Use o link \"Bilhetes\" de cada sessão para ver a disponibilidade em tempo real. O <em>Clube dos Poetas Mortos</em> esgota com frequência; compre antes de sair de casa.",
    footer:c=>`Fontes: Time Out Lisboa, Agenda Cultural de Lisboa, Viral Agenda, Ticketline, sites dos teatros. Atualizado a ${c}.`,
    last:"Última sessão", tickets:"Bilhetes ↗", ends:"termina ~", min:"min",
    later:(h,m)=>`Daqui a ${h}h${m}`, soon:m=>`Começa em ${m} min`, on:"A decorrer", past:"Terminou", laterToday:"Mais logo", tmr:"Amanhã", tbc:"Ver hora",
    allDone:"Já não começa mais nenhuma sessão hoje.", seeTmr:"Ver o que há amanhã ↓",
    noTmr:"Ainda não há sessões confirmadas para amanhã."
  },
  en:{
    sub:"Every play on in Lisbon today, ordered by curtain time. Status updates live against Lisbon time:",
    stale:d=>`This listing is for ${d}. Today's programme will differ.`,
    fOpen:"Still catchable", fAll:"Whole day", filters:"Filter sessions",
    tmrWarn:"Heads up: this is tomorrow's programme, gathered today. Times and seats can change, and the list is checked again tomorrow morning.",
    tomorrow:"Tomorrow", tbcHead:"Also on today, time not confirmed",
    tbcNote:"These are listed for today by the box office, but we couldn't confirm the time. Check the link before you go.",
    avail:"<strong>About seat availability:</strong> Ticketline and BOL load their seat maps only in the browser, so remaining seats can't be read from outside. Use each \"Tickets\" link to see live availability. <em>Clube dos Poetas Mortos</em> sells out often; book before travelling.",
    footer:c=>`Sources: Time Out Lisboa, Agenda Cultural de Lisboa, Viral Agenda, Ticketline, theatre websites. Updated ${c}.`,
    last:"Last performance", tickets:"Tickets ↗", ends:"ends ~", min:"min",
    later:(h,m)=>`In ${h}h ${m}`, soon:m=>`Starts in ${m} min`, on:"In progress", past:"Ended", laterToday:"Later today", tmr:"Tomorrow", tbc:"Check time",
    allDone:"No more curtains rising today.", seeTmr:"See what's on tomorrow ↓",
    noTmr:"Nothing confirmed for tomorrow yet."
  }
};

let lang = "pt", mode = "open";
try { const s = localStorage.getItem("hec-lang"); if (s === "en" || s === "pt") lang = s; } catch(e){}

const tx = v => (v && typeof v === "object") ? (v[lang] || v.pt || v.en) : v;
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const toMin = s => {const [h,m]=s.split(":").map(Number);return h*60+m};
const pad = n => String(n).padStart(2,"0");
function longDate(iso, withYear){
  const d = new Date(iso+"T12:00:00Z");
  const opts = {timeZone:"UTC",weekday:"long",day:"numeric",month:"long"}; if (withYear) opts.year = "numeric";
  const s = d.toLocaleDateString(lang==="pt"?"pt-PT":"en-GB",opts);
  return s.charAt(0).toUpperCase()+s.slice(1);
}
function lisbonNow(){
  const p = new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Lisbon",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(new Date());
  const g = k => p.find(x=>x.type===k).value;
  return {date:`${g("year")}-${g("month")}-${g("day")}`, min:(+g("hour")%24)*60 + +g("minute"), hm:`${pad(+g("hour")%24)}:${g("minute")}`};
}
function status(s, now){
  const L = UI[lang];
  if(now.date > DAY) return ["past",L.past];
  if(now.date < DAY) return ["later",L.laterToday];
  const start = toMin(s.t), end = start + s.d, n = now.min;
  if(n >= end) return ["past",L.past];
  if(n >= start) return ["on",L.on];
  if(start - n <= 60) return ["soon",L.soon(start-n)];
  return ["later",L.later(Math.floor((start-n)/60),pad((start-n)%60))];
}
function rowHTML(s, st){
  const L = UI[lang], meta = [];
  if(s.last) meta.push(`<span class="last">${L.last}</span>`);
  if(s.tag) meta.push(`<span>${esc(tx(s.tag))}</span>`);
  if(s.price) meta.push(`<span>${esc(s.price)}</span>`);
  if(s.d && s.t) meta.push(`<span>${s.d} ${L.min}</span>`);
  meta.push(`<a href="${esc(s.link)}" target="_blank" rel="noopener">${L.tickets}</a>`);
  let end = "";
  if(s.t){const e=toMin(s.t)+s.d; end=`${L.ends}${pad(Math.floor(e/60)%24)}:${pad(e%60)}`;}
  return `<article class="row ${st[0]==="past"?"past":""}">
    <div class="time">${s.t||"—"}${end?`<small>${end}</small>`:""}</div>
    <div class="info"><h3 class="title">${esc(tx(s.title))}</h3><div class="venue">${esc(tx(s.venue))}</div><div class="meta">${meta.join("")}</div></div>
    <span class="chip s-${st[0]}">${esc(st[1])}</span></article>`;
}
const $ = id => document.getElementById(id);
function render(){
  const L = UI[lang], now = lisbonNow();
  document.documentElement.lang = lang;
  $("lang-pt").setAttribute("aria-pressed", lang==="pt");
  $("lang-en").setAttribute("aria-pressed", lang==="en");
  $("eyebrow").textContent = "Lisboa · " + longDate(DAY,true);
  $("sub").textContent = L.sub;
  $("clock").textContent = now.hm;
  $("stale").hidden = now.date === DAY;
  $("stale").textContent = L.stale(longDate(DAY,true));
  $("filters").setAttribute("aria-label", L.filters);
  $("f-open").textContent = L.fOpen; $("f-all").textContent = L.fAll;
  $("f-open").setAttribute("aria-pressed", mode==="open"); $("f-all").setAttribute("aria-pressed", mode==="all");

  const rows = SHOWS.map(s=>({s,st:status(s,now)})).filter(r=>mode==="all"||r.st[0]!=="past");
  const upcoming = SHOWS.some(s=>["later","soon"].includes(status(s,now)[0]));
  const nudge = upcoming ? "" : `<p class="empty">${L.allDone} <a href="#amanha">${L.seeTmr}</a></p>`;
  $("board").innerHTML = nudge + rows.map(r=>rowHTML(r.s,r.st)).join("");

  $("tomorrow-head").textContent = `${L.tomorrow} · ${longDate(TOMORROW.day,false)}`;
  $("tomorrow-warn").textContent = L.tmrWarn;
  $("tomorrow-note").textContent = tx(TOMORROW.note);
  $("tomorrow-note").hidden = !tx(TOMORROW.note);
  $("tomorrow").innerHTML = TOMORROW.shows.length
    ? TOMORROW.shows.map(s=>rowHTML(s,["later",L.tmr])).join("")
    : `<p class="empty">${L.noTmr}</p>`;

  $("tbc-head").textContent = L.tbcHead;
  $("tbc-note").textContent = L.tbcNote;
  $("tbc-block").hidden = TBC.length === 0;
  $("tbc").innerHTML = TBC.map(s=>rowHTML(s,["tbc",L.tbc])).join("");
  $("avail-note").innerHTML = L.avail;
  $("footer").textContent = L.footer(COMPILED);
}
function setLang(l){ lang = l; try{ localStorage.setItem("hec-lang", l); }catch(e){} render(); }
$("lang-pt").addEventListener("click",()=>setLang("pt"));
$("lang-en").addEventListener("click",()=>setLang("en"));
$("f-open").addEventListener("click",()=>{mode="open";render()});
$("f-all").addEventListener("click",()=>{mode="all";render()});
render(); setInterval(render,30000);
</script>
